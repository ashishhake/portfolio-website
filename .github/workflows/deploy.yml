name: deploy to aws

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4
      
      - name: setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install
      
      - name: Validate HTML
        run: npm run test
      
      - name: CSS lint
        run: npm run lint:css
      
      - name: Scan for secrets
        run: |
          if grep -r "AKIA[0-9A-Z]{16}" site/; then
            echo "Possible AWS key found!"
            exit 1
          fi
          echo "No secrets found"

  build:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Copy site/ to dist/
        run: cp -r site/ dist/
  
  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: checkout code
        uses: actions/checkout@v4
      
      - name: Check required files exist
        run: |
          test -f site/index.html
          test -f site/404.html

      - name: Check file sizes
        run: |
          find site/ -size +1M -exec echo "Too large: {}" \;


  deploy:
    runs-on: ubuntu-latest
    needs: test

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync site/ s3://${{ vars.S3_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
