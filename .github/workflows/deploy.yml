name: deploy to aws

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4
      
      - name: setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install
      
      - name: Validate HTML
        run: npm run test
      
      - name: CSS lint
        run: npm run lint:css
      
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog-actions-scan@v1
        with:
          path: ./

  build:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Copy site/ to dist/
        run: cp -r site/ dist/

