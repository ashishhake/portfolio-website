<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 | Not Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f12;
            color: #39ff14;
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
        }
        .cursor {
            display: inline-block;
            width: 10px;
            height: 1em;
            background-color: #39ff14;
            vertical-align: text-bottom;
            animation: blink 1s step-start infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-6xl md:text-8xl font-bold mb-4">404</h1>
        <p class="text-lg md:text-xl text-[#c9d1d9] mb-8">
            &gt; error: route not found...<span class="cursor"></span>
        </p>
        <a href="index.html" class="inline-block border border-[#39ff14] text-[#39ff14] px-6 py-3 font-bold hover:bg-[#39ff14] hover:text-[#0b0f12] transition-colors">
            return ./home
        </a>
    </div>
</body>
</html>
