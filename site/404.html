<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 – Page Not Found</title>
  <link rel="stylesheet" href="./css/styles.css">
  <style>
    .error-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      gap: 16px;
    }
    .error-code {
      font-family: 'Space Mono', monospace;
      font-size: clamp(4rem, 15vw, 8rem);
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }
    .error-msg {
      font-size: 1.2rem;
      font-weight: 600;
      color: #fff;
    }
    .error-sub {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 1px;
    }
    .back-link {
      display: inline-block;
      margin-top: 24px;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 10px 24px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .back-link:hover {
      background: var(--accent);
      color: var(--bg);
    }
  </style>
</head>
<body>
  <div class="error-page">
    <div class="error-code">404</div>
    <div class="error-msg">Page Not Found</div>
    <div class="error-sub">// The resource you requested does not exist</div>
    <a href="/" class="back-link">← Back to Home</a>
  </div>
</body>
</html>
